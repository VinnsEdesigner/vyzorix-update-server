# render.yaml — Vyzorix Update Server on Render
#
# Deployment: Connect this repo to Render, select this file, and deploy.
#
# Disk: /data is a mounted 1GB persistent volume. SQLite DB lives here.
#       Without this, every redeploy would reset the database.
#
# Sleep prevention (Hobby plan): Render sleeps after 15–30 min of inactivity.
# Set up a free UptimeRobot monitor → GET https://your-service.onrender.com/healthz
# every 10 minutes to keep the container warm and reduce cold-start latency.
#
# Auth: JWT-based operator authentication with Google OAuth support.
# Email: Resend API for verification and password reset (optional).

services:
  - type: web
    name: vyzorix-update-server
    env: docker
    region: oregon
    plan: starter
    autoDeploy: true
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    numInstances: 1

    # Persistent disk for SQLite database and data
    disk:
      name: vyzorix-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # Application
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      # SSR Configuration
      # Disable SSR auto-build since Docker image includes pre-built assets
      - key: SSR_ENABLED
        value: "true"
      - key: SSR_AUTO_BUILD
        value: "false"

      # Database — production uses Turso (libSQL over HTTP). Set DATABASE_BACKEND
      # to "turso" and provide TURSO_DB_URL + TURSO_AUTH_TOKEN below.
      # For local SQLite on the mounted disk, set DATABASE_BACKEND=sqlite and
      # keep DATABASE_URL=/data/vyzorix.db (the disk below still persists).
      - key: DATABASE_BACKEND
        value: turso
      - key: DATABASE_URL
        value: /data/vyzorix.db
      - key: DATABASE_MAX_OPEN_CONNS
        value: "16"
      - key: DATABASE_MAX_IDLE_CONNS
        value: "8"
      - key: DATABASE_CONN_MAX_LIFETIME
        value: "30m"
      - key: DATABASE_CONN_MAX_IDLE_TIME
        value: "5m"
      - key: DATABASE_REQUEST_TIMEOUT
        value: "15s"
      - key: DATABASE_HEALTH_CHECK_PERIOD
        value: "30s"
      # Turso credentials — generate at https://turso.io → database → Access Tokens.
      - key: TURSO_DB_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Paths — /data matches the mounted disk, /app/bin and /app/public are in the image
      - key: VYZORIX_API_DIR
        value: /data
      - key: VYZORIX_BIN_DIR
        value: /app/bin
      - key: VYZORIX_PUBLIC_DIR
        value: /app/public

      # Security
      - key: ENFORCE_HMAC
        value: "true"
      - key: HMAC_WINDOW_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "https://your-dashboard.example.com,http://localhost:5173"

      # Dashboard secrets — generate with: openssl rand -hex 32
      - key: TOKEN_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_DURATION_HOURS
        value: "168"

      # Google OAuth for "Sign in with Google" (optional)
      # Get credentials from: Google Cloud Console → APIs & Services → Credentials
      # Authorised redirect URI: https://your-service.onrender.com/v1/auth/google/callback
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      # Email (Resend) — optional, for verification and password reset
      # Get from: https://resend.com API Keys
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "noreply@vyzorix.app"
      - key: EMAIL_FROM_NAME
        value: "Vyzorix"

      # Firebase — for push notifications (optional)
      - key: FIREBASE_CREDENTIALS
        sync: false

      # Deployment URLs — must be set correctly for OAuth redirects to work
      - key: BASE_URL
        value: "https://vyzorix-update-server.onrender.com"
      - key: FRONTEND_URL
        value: "https://your-frontend.onrender.com"
