# Vyzorix Production Nginx Configuration
# TLS-terminating reverse proxy for the Vyzorix Go API server.
#
# Why Nginx over Go's built-in TLS:
#   - Battle-tested TLS stack with automatic cert renewal (Let's Encrypt / certbot)
#   - Connection-level rate limiting and DDoS protection (limit_req_zone)
#   - Efficient static file serving (SPA assets) without Go overhead
#   - Gzip/Brotli compression offloaded from the app
#   - Zero-downtime deployments (nginx stays up while Go restarts behind it)
#   - Request body size limits at the edge (before traffic reaches the app)
#   - Real-world HTTP/2 and HTTP/3 support without Go TLS complexity
#
# Deploy: cp this to /etc/nginx/sites-available/vyzorix && ln -s ../sites-available/vyzorix /etc/nginx/sites-enabled/
# Certs:  certbot --nginx -d api.vyzorix.com

# Rate limiting zone: 10 requests/sec per IP, burst of 20.
limit_req_zone $binary_remote_addr zone=vyzorix_api:10m rate=10r/s;

# Connection limiting: max 10 concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=vyzorix_conn:10m;

# Upstream: the Go API server (adjust port as needed).
upstream vyzorix_backend {
    server 127.0.0.1:12000;
    keepalive 32;
}

# HTTP to HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.vyzorix.com;

    # ACME challenge passthrough for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vyzorix.com;

    # TLS certificates (managed by certbot).
    ssl_certificate     /etc/letsencrypt/live/api.vyzorix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vyzorix.com/privkey.pem;

    # TLS hardening (Mozilla intermediate compatibility, 2024).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (defense-in-depth; the app also sets these).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request body size limit (protects against large payload DoS).
    client_max_body_size 10m;

    # Timeouts.
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Rate limiting.
    limit_req zone=vyzorix_api burst=20 nodelay;
    limit_conn vyzorix_conn 10;

    # Proxy to Go API.
    location / {
        proxy_pass http://vyzorix_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $request_id;

        # WebSocket support (for /v1/device/:imei/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for proxied requests.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Health check (no rate limit, no logging).
    location = /health {
        proxy_pass http://vyzorix_backend;
        access_log off;
        limit_req off;
    }

    # Block sensitive paths.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
