# docker-compose.yml -  VPS Deployment
#
#   Internet → [Nginx :443 TLS] → [Go API :3000]
#
# Usage:
#   docker compose up -d          # Start nginx + api
#   docker compose logs -f        # View logs
#   docker compose down           # Stop
#
#     TLS setup (VPS with a domain):
#   1. Edit tooling/nginx/vyzorix.conf — replace api.vyzorix.com with current domain
#   2. docker compose up -d vyzorix    # Start API first
#   3. certbot certonly --webroot -w /var/www/html -d your-domain.com
#   4. docker compose up -d            # Start everything (nginx picks up certs)
#
# On Render: Render handles TLS automatically — no nginx needed.

services:
  nginx:
    build:
      context: .
      dockerfile: ./tooling/nginx/Dockerfile
    container_name: vyzorix
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      vyzorix:
        condition: service_healthy
    networks:
      - vyzorix-network

  # Go API server (internal only — nginx is the entry point)
  vyzorix:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: vyzorix-server
    restart: unless-stopped
    environment:
      # Secrets come from the environment / a .env file, never from this file.
      # Generate each with: openssl rand -hex 32
      - API_KEY_primary=${API_KEY_primary:?API_KEY_primary must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - DEVICE_SECRET=${DEVICE_SECRET:-}
      - SERVER_API_TOKEN=${SERVER_API_TOKEN:?SERVER_API_TOKEN must be set}
      - SSR_ENABLED=true
      - SSR_AUTO_BUILD=false
      - NODE_ENV=production
      - PORT=3000
      # Bind all interfaces inside the container (required for nginx to reach it
      # over the compose network). This container publishes no host port, so it is
      # not reachable from outside the compose network.
      - BIND_ADDR=0.0.0.0
      - DATABASE_URL=/data/vyzorix.db
      - VYZORIX_API_DIR=/data
      - VYZORIX_BIN_DIR=/app/bin
      - VYZORIX_PUBLIC_DIR=/app/public
      - ENFORCE_HMAC=true
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
    volumes:
      - vyzorix-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vyzorix-network

  # Second API instance (read-only hardening demo). Start with:
  #   docker compose --profile api2 up -d
  #
  # Deliberately NOT published to the host: it joins the internal network only, so
  # it is reachable through nginx (with TLS) and never as cleartext on a host port.
  # Secrets come from the environment / .env file, never from this file.
  vyzorix-api2:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: vyzorix-api2
    profiles:
      - api2
    environment:
      - SSR_ENABLED=true
      - SSR_AUTO_BUILD=false
      - NODE_ENV=production
      - PORT=3000
      - BIND_ADDR=0.0.0.0
      - DATABASE_URL=/data/vyzorix.db
      # Secrets: set these in your shell or a .env file next to this compose file.
      # The app refuses to start in production if they are missing, too short,
      # placeholders, or reused across purposes.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - SERVER_API_TOKEN=${SERVER_API_TOKEN:?SERVER_API_TOKEN must be set}
      - DEVICE_SECRET=${DEVICE_SECRET:-}
      - API_KEY_primary=${API_KEY_primary:?API_KEY_primary must be set}
    volumes:
      - vyzorix-data-2:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 512
        hard: 512
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vyzorix-network

volumes:
  vyzorix-data:
    driver: local
  vyzorix-data-2:
    driver: local

networks:
  vyzorix-network:
    driver: bridge
