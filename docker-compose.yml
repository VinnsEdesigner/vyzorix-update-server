# docker-compose.yml - Production VPS Deployment
#
# Architecture:
#   Internet → [Nginx :443 TLS] → [Go API :3000]
#
# Usage:
#   docker compose up -d          # Start nginx + api
#   docker compose logs -f        # View logs
#   docker compose down           # Stop
#
# First-time TLS setup (VPS with a domain):
#   1. Edit tooling/nginx/vyzorix.conf — replace api.vyzorix.com with your domain
#   2. docker compose up -d vyzorix    # Start API first
#   3. certbot certonly --webroot -w /var/www/html -d your-domain.com
#   4. docker compose up -d            # Start everything (nginx picks up certs)
#
# On Render: Render handles TLS automatically — no nginx needed.
# Just set ALLOWED_ORIGINS in the Render dashboard.

services:
  # Nginx reverse proxy (TLS termination, rate limiting, security headers)
  nginx:
    build:
      context: .
      dockerfile: ./tooling/nginx/Dockerfile
    container_name: vyzorix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      vyzorix:
        condition: service_healthy
    networks:
      - vyzorix-network

  # Go API server (internal only — nginx is the entry point)
  vyzorix:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: vyzorix-server
    restart: unless-stopped
    environment:
      - API_KEY_primary=change-me-in-production
      - TOKEN_SECRET=change-me-32-chars-minimum!!
      - JWT_SECRET=change-me-32-chars-minimum!!
      - SESSION_SECRET=change-me-32-chars-minimum!!
      - DEVICE_SECRET=change-me-32-chars-minimum!!
      - SERVER_API_TOKEN=change-me-server-api-token
      - SSR_ENABLED=true
      - SSR_AUTO_BUILD=false
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/data/vyzorix.db
      - VYZORIX_API_DIR=/data
      - VYZORIX_BIN_DIR=/app/bin
      - VYZORIX_PUBLIC_DIR=/app/public
      - ENFORCE_HMAC=true
      - ALLOWED_ORIGINS=https://your-domain.com
    volumes:
      - vyzorix-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vyzorix-network

  # Hardened profile (read-only, cap_drop, resource limits)
  vyzorix-hardened:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: vyzorix-hardened
    profiles:
      - hardened
    ports:
      - "3001:3000"
    environment:
      - TOKEN_SECRET=dev-token-secret-minimum-32-chars!!
      - JWT_SECRET=dev-jwt-secret-minimum-32-chars!!
      - SSR_ENABLED=true
      - SSR_AUTO_BUILD=false
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/data/vyzorix.db
    volumes:
      - vyzorix-data-hardened:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 512
        hard: 512
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vyzorix-network

volumes:
  vyzorix-data:
    driver: local
  vyzorix-data-hardened:
    driver: local

networks:
  vyzorix-network:
    driver: bridge
