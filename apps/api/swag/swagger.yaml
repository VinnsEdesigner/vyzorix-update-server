  /admin/updates/check:
    get:
      consumes:
      - application/json
      - application/json
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: string
      - description: Organization ID
        in: header
        name: X-Organization-ID
