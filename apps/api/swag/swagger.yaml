definitions:
  internal_api_handlers_alert.ruleRequest:
    properties:
      condition:
        type: string
      enabled:
        type: boolean
      for_seconds:
        type: integer
      metric:
        type: string
      name:
        type: string
      notify_interval_seconds:
        type: integer
      on_error:
        type: string
      on_no_data:
        type: string
      threshold:
        type: number
      webhook_url:
        type: string
    type: object
info:
  contact: {}
