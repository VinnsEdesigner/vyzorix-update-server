"""Root mutation — write operations. Risk-gated commands may require a confirmation token."""
type Mutation {
  """Accept an invitation to join an organization"""
  acceptInvitation(notes: String, token: String!): Membership
  """Acknowledge (approve/reject) an inbox entry"""
  ackInbox(action: AckAction!, imei: String!, notes: String): AckResult
  """Cancel a pending command"""
  cancelCommand(dispatchId: ID!): CancelCommandResponse
  """Cancel a pending invitation"""
  cancelInvitation(id: ID!): Boolean
  """Cancel a pending update push"""
  cancelUpdate(id: ID!, organizationId: String!): CancelPushResponse
  """Create an org-scoped alert rule"""
  createAlertRule(condition: String!, enabled: Boolean, forSeconds: Int, metric: String!, name: String!, notifyIntervalSeconds: Int, onError: String, onNoData: String, organizationId: String!, threshold: Float!, webhookUrl: String): AlertRule
  """Create an org-scoped annotation"""
  createAnnotation(endTime: String, organizationId: String!, source: String, startTime: String!, tags: [String], text: String, title: String!): Annotation
  """Create an org-scoped contact point"""
  createContactPoint(channel: String!, config: JSON, enabled: Boolean, name: String!, organizationId: String!, secret: String): ContactPoint
  """Create a new organization"""
  createOrganization(maxMembers: Int, name: String!): CreateOrganizationPayload
  """Create an org-scoped service account"""
  createServiceAccount(name: String!, organizationId: String!): ServiceAccount
  """Create a service account token (full key returned once)"""
  createServiceAccountToken(expiresAt: String, name: String, organizationId: String!, scopes: [String], serviceAccountId: ID!): ServiceAccountToken
  """Delete an org-scoped alert rule"""
  deleteAlertRule(organizationId: String!, ruleId: ID!): Boolean
  """Delete an org-scoped annotation"""
  deleteAnnotation(annotationId: ID!, organizationId: String!): Boolean
  """Delete an org-scoped contact point"""
  deleteContactPoint(contactPointId: ID!, organizationId: String!): Boolean
  """Delete a device"""
  deleteDevice(id: ID!): Boolean
  """Delete an organization (soft delete)"""
  deleteOrganization(id: ID!): Boolean
  """Delete an org-scoped service account (revokes all tokens)"""
  deleteServiceAccount(organizationId: String!, serviceAccountId: ID!): Boolean
  """Deregister a device (soft delete with 30-day retention)"""
  deregisterDevice(hard: Boolean, imei: String!): DeregisterResult
  """Force disconnect a device"""
  disconnectDevice(deviceId: ID!): Boolean
  """Manually evaluate an alert rule"""
  evaluateAlertRule(organizationId: String!, ruleId: ID!): Boolean
  """Invite a member to an organization"""
  inviteMember(email: String!, notes: String, organizationId: ID!, role: OrgRole!): Invitation
  """Push an update to devices"""
  pushUpdate(deviceIds: [ID!]!, installType: String!, organizationId: String!, scheduledAt: Int, version: String!): PushUpdateResponse
  """Reinstate a suspended member"""
  reinstateMember(memberId: ID!, organizationId: ID!): Boolean
  """Reject an invitation"""
  rejectInvitation(notes: String, token: String!): Boolean
  """Remove a member from an organization"""
  removeMember(memberId: ID!, organizationId: ID!): Boolean
  """Retry a failed command"""
  retryCommand(dispatchId: ID!): Command
  """Rotate a service account token (old revoked, new created)"""
  rotateServiceAccountToken(organizationId: String!, serviceAccountId: ID!, tokenId: ID!): ServiceAccountToken
  """Send a command to a device"""
  sendCommand(args: JSON, command: String!, confirmationToken: String, deviceId: ID!): CommandResult
  """Suspend an active member"""
  suspendMember(memberId: ID!, organizationId: ID!): Boolean
  """Trigger a GitHub sync"""
  syncFromGitHub: SyncResponse
  """Sync updates from GitHub (spec-compliant name)"""
  syncUpdates: SyncResponse
  """Send a test notification to the contact point"""
  testContactPoint(contactPointId: ID!, organizationId: String!): Boolean
  """Transfer a device to another organization"""
  transferDevice(imei: String!, sourceOrganizationId: ID!, targetOrganizationId: ID!): TransferDevicePayload
  """Transfer super_admin ownership to another member"""
  transferOwnership(memberId: ID!, organizationId: ID!): Boolean
  """Update an org-scoped alert rule"""
  updateAlertRule(condition: String!, enabled: Boolean, forSeconds: Int, metric: String!, name: String!, notifyIntervalSeconds: Int, onError: String, onNoData: String, organizationId: String!, ruleId: ID!, threshold: Float!, webhookUrl: String): AlertRule
  """Update an org-scoped contact point"""
  updateContactPoint(channel: String!, config: JSON, contactPointId: ID!, enabled: Boolean, name: String!, organizationId: String!, secret: String): ContactPoint
  """Update settings for a specific device"""
  updateDeviceSettings(deviceImei: String!, input: UpdateDeviceSettingsInput!, organizationId: String!): DeviceSettings
  """Update FCM token for a device"""
  updateFCMToken(deviceId: ID!, token: String!): Device
  """Update a member's role"""
  updateMemberRole(memberId: ID!, organizationId: ID!, role: OrgRole!): Membership
  """Update current operator's notification settings"""
  updateMyNotifications(input: UpdateNotificationsInput!): NotificationSettings
  """Update an organization"""
  updateOrganization(id: ID!, isActive: Boolean, maxMembers: Int, name: String): Organization
  """Update settings for an organization"""
  updateOrganizationSettings(input: UpdateOrganizationSettingsInput!, organizationId: String!): OrganizationSettings
}

