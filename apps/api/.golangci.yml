version: "2"

run:
  go: "1.26"
  modules-download-mode: readonly
  tests: false
  timeout: 15m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - dupword
    - errcheck
    - errchkjson
    - errname
    - exhaustive
    - funlen
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - loggercheck
    - mirror
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - unparam
    - unused
    - wastedassign
  exclusions:
    rules:
      - path: "cmd/verify"
        linters:
          - gosec
          - funlen
          - gocyclo
      - path: "internal/domain/event/event_entity.go"
        linters:
          - exhaustive
      - path: "internal/application/event/event_processor.go"
        linters:
          - exhaustive
      - path: "internal/application/keys/service.go"
        linters:
          - unparam
      # swaggo annotations are directive comments parsed by `swag init`:
      # `@Param body body openapi.X` repeats "body" by design (param name +
      # location), and `@Router`/`@Param` lines must not end in a period.
      # The handlers package is annotation-dense, so exclude it from these two
      # comment-style linters.
      - path: "internal/api/handlers"
        linters:
          - dupword
          - godot
      # Generated swag output (DO NOT EDIT) — regenerated by `swag init`.
      - path: "swag/"
        linters:
          - godot
      # Machine-generated schema structs (build_schemas.py) — field order is
      # generator-controlled and re-emitted on every regen; hand-tuning
      # fieldalignment here is futile.
      - path: "internal/api/schema/zz_generated"
        linters:
          - govet
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 150
      statements: 100
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104
        - G115
        - G118
        - G201
        - G202
        - G204
        - G301
        - G302
        - G304
        - G306
        - G307
        - G401
        - G404
        - G101
        - G114
        - G124
        - G703
        - G702
    govet:
      enable:
        - fieldalignment
        - shadow
        - unusedwrite
        - nilness
        - printf
    loggercheck: {}
    nestif:
      min-complexity: 20
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: unexported-naming
          disabled: true
    godot:
      scope: all
      exclude:
        - "^// Exported:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
