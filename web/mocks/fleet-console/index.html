<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vyzorix — Fleet Management (Grafana-style mock)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="chrome">
    <!-- ============ TOP BAR (rows 1: menu, search, actions) ============ -->
    <header class="topbar">
      <button class="topbar__icon-btn" id="menu-toggle" title="Toggle menu" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar__search" title="Command palette" id="topbar-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
        <input class="topbar__search-input" id="global-search" placeholder="Search dashboards, devices, commands…" />
        <kbd>⌘K</kbd>
      </div>
      <div class="topbar__spacer"></div>
      <button class="topbar__icon-btn" title="Kiosk mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button class="topbar__icon-btn" title="Help">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
      </button>
      <div class="user" id="user">
        <button class="avatar" id="user-btn" title="Account" aria-haspopup="menu" aria-expanded="false">OP</button>
        <div class="user-menu" id="user-menu" role="menu" hidden>
          <div class="user-menu__head">
            <div class="avatar avatar--lg">OP</div>
            <div class="user-menu__id">
              <div class="user-menu__name">Oscar Porter</div>
              <div class="tiny muted">op@acme.io</div>
            </div>
          </div>
          <div class="user-menu__sep"></div>
          <button class="user-menu__item" data-go="profile" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
          </button>
          <button class="user-menu__item" data-go="settings" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 2.6 14a1.65 1.65 0 0 0-1.51-1H1a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 2.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8 3.6 1.65 1.65 0 0 0 9 2.09V2a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 14 3.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.4 8H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Preferences
          </button>
          <button class="user-menu__item" data-go="api-keys" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 1-7.1 7.1 5 5 0 0 1 7.1-7.1zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>
            API keys
          </button>
          <button class="user-menu__item" data-go="logs" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
            Notification history
          </button>
          <div class="user-menu__sep"></div>
          <button class="user-menu__item user-menu__item--danger" data-action="signout" role="menuitem">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </header>

    <!-- ============ SECOND BAR (breadcrumb) ============ -->
    <div class="appbar">
      <nav class="crumbs">
        <span class="crumbs__home">Vyzorix</span>
        <span class="crumbs__sep">/</span>
        <b id="crumb">Dashboard</b>
      </nav>
      <div class="topbar__spacer"></div>
      <button class="btn btn--ghost tiny">Share</button>
      <button class="btn btn--ghost tiny">⟳ Refresh</button>
    </div>

    <!-- ============ THIRD BAR (in-page tabs for the current view) ============ -->
    <nav class="tabbar" id="page-tabs" aria-label="Page tabs"></nav>

    <div class="body">
      <!-- Backdrop for the auto-hiding mega menu -->
      <div class="scrim" id="scrim"></div>

      <!-- ============ MEGA MENU (Grafana floating nav: slides out from under the top bar) ============ -->
      <aside class="meganav" id="meganav">
        <!-- Grafana shows no brand header when the menu is floating; just a close button -->
        <div class="meganav__head">
          <button class="meganav__dock" id="menu-close" title="Close menu" aria-label="Close menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="meganav__scroll">
          <div class="nav__section">
            <div class="nav__section-label">Fleet</div>
            <button class="nav__item is-active" data-view="dashboard">
              <span class="nav__icon" data-icon="dashboard"></span>
              <span class="nav__label">Dashboard</span>
            </button>
            <button class="nav__item" data-view="devices">
              <span class="nav__icon" data-icon="devices"></span>
              <span class="nav__label">Devices</span><span class="nav__badge">3</span>
            </button>
            <button class="nav__item" data-view="commands">
              <span class="nav__icon" data-icon="commands"></span>
              <span class="nav__label">Commands</span>
            </button>
            <button class="nav__item" data-view="telemetry">
              <span class="nav__icon" data-icon="telemetry"></span>
              <span class="nav__label">Telemetry</span>
            </button>
          </div>

          <div class="nav__section">
            <div class="nav__section-label">Operations</div>
            <button class="nav__item" data-view="updates">
              <span class="nav__icon" data-icon="updates"></span>
              <span class="nav__label">Updates (OTA)</span>
            </button>
            <button class="nav__item" data-view="alerts">
              <span class="nav__icon" data-icon="alerts"></span>
              <span class="nav__label">Alerts</span><span class="nav__badge">2</span>
            </button>
            <button class="nav__item" data-view="logs">
              <span class="nav__icon" data-icon="logs"></span>
              <span class="nav__label">Logs</span>
            </button>
          </div>

          <!-- Administration (Grafana-style: collapsible groups + a section) -->
          <div class="nav__section">
            <div class="nav__section-label">Administration</div>

            <div class="nav__group">
              <button class="nav__group-head" aria-expanded="true">
                <span class="nav__icon" data-icon="settings"></span>
                <span class="nav__label">General</span>
                <svg class="nav__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="nav__group-body">
                <button class="nav__item nav__item--child" data-view="admin-defaultprefs">
                  <span class="nav__icon" data-icon="shield"></span>
                  <span class="nav__label">Default preferences</span>
                </button>
                <button class="nav__item nav__item--child" data-view="admin-provisioning">
                  <span class="nav__icon" data-icon="updates"></span>
                  <span class="nav__label">Provisioning</span>
                </button>
              </div>
            </div>

            <div class="nav__group">
              <button class="nav__group-head" aria-expanded="true">
                <span class="nav__icon" data-icon="settings"></span>
                <span class="nav__label">Users and access</span>
                <svg class="nav__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="nav__group-body">
                <button class="nav__item nav__item--child" data-view="admin-users">
                  <span class="nav__icon" data-icon="profile"></span>
                  <span class="nav__label">Users</span>
                </button>
                <button class="nav__item nav__item--child" data-view="admin-serviceaccounts">
                  <span class="nav__icon" data-icon="serviceaccounts"></span>
                  <span class="nav__label">Service accounts</span>
                </button>
              </div>
            </div>

            <button class="nav__item" data-view="admin-auth">
              <span class="nav__icon" data-icon="signin"></span>
              <span class="nav__label">Authentication</span>
            </button>
          </div>
        </div>

        <!-- Grafana's docked menu footer: divider + Customise navigation + dock control -->
        <hr class="meganav__divider" />
        <div class="meganav__footer">
          <button class="btn btn--ghost" id="menu-customise">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            Customise navigation
          </button>
        </div>
      </aside>

      <!-- ============ MAIN ============ -->
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="toast" id="toast">
    <b>Command delivered</b>
    <span class="muted">reboot → IMEI 35…7102 · HMAC verified</span>
    <div class="toast__time">just now</div>
  </div>

  <script src="./icons.js"></script>
  <script src="./charts.js"></script>
  <script src="./app.js"></script>
</body>
</html>
