# Dependabot Configuration
# Automated dependency security updates

version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    allow:
      # Allow updates for all dependencies
      - dependency-type: "all"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "@VinnsEdesigner/security"
    ignore:
      # Ignore major updates that might break compatibility
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore updates that require manual review
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "docker/login-action"
        update-types: ["version-update:semver-major"]

  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "go"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "@VinnsEdesigner/security"
    ignore:
      # Ignore major updates to Go dependencies
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      # Pin base image versions explicitly
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# Security advisories configuration
security:
  # Enable automated security PRs
  enable-beta-uses: true
  
# Vune
```
