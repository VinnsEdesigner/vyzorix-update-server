name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # =============================================
  # CONFIGURATION GUARDIANS
  
  # =============================================
  linter-config-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tooling/scripts/validate-golangci-config.sh
            apps/api/.golangci.yml
          sparse-checkout-cone-mode: false

      - name: Validate Go linter config
        run: |
          chmod +x tooling/scripts/validate-golangci-config.sh
          ./tooling/scripts/validate-golangci-config.sh

  eslint-config-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tooling/scripts/validate-eslint-config.sh
            apps/web/eslint.config.js
            apps/web/package.json
          sparse-checkout-cone-mode: false

      - name: Validate ESLint config
        run: |
          chmod +x tooling/scripts/validate-eslint-config.sh
          ./tooling/scripts/validate-eslint-config.sh

  # =============================================
  # SECURITY VALIDATOR
  
  # =============================================
  security-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security validation
        run: |
          chmod +x tooling/scripts/validate-security.sh
          ./tooling/scripts/validate-security.sh

  # =============================================
  # DEPENDENCY AUDITOR
  
  # =============================================
  dependency-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audit
        run: |
          chmod +x tooling/scripts/validate-dependencies.sh
          ./tooling/scripts/validate-dependencies.sh

  # =============================================
  # TYPESCRIPT STRICT VALIDATOR

  # =============================================
  typescript-strict-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run TypeScript strict validation
        run: |
          chmod +x tooling/scripts/validate-typescript-strict.sh
          ./tooling/scripts/validate-typescript-strict.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: null  # Use version from packageManager field
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build dependencies
        run: pnpm run prelint
        
      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: null  # Use version from packageManager field
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build dependencies
        run: pnpm run prelint
        
      - name: Test
        run: pnpm test

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/api/go.sum
          
      - name: Setup Go module
        run: cd apps/api && go mod tidy
          
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: apps/api
          
      - name: Run tests
        run: go test ./...
        working-directory: apps/api

  # =============================================
  # DOCKER BUILD & SECURITY SCANNING
  # =============================================

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: vyzorix-update-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          docker images vyzorix-update-server:latest
          docker history vyzorix-update-server:latest

  docker-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: vyzorix-update-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create data directory
        run: mkdir -p /tmp/vyzorix-data

      - name: Run container (SPA mode)
        run: |
          # Clean up any existing data directory to ensure fresh migrations
          rm -rf /tmp/vyzorix-data
          mkdir -p /tmp/vyzorix-data
          docker run -d --name vyzorix-test \
            -e API_KEY_primary=test-secret-minimum-32-chars!! \
            -e SERVER_API_TOKEN=test-secret-minimum-32-chars!! \
            -e JWT_SECRET=test-jwt-secret-minimum-32-chars!! \
            -e SSR_ENABLED=false \
            -v /tmp/vyzorix-data:/data \
            -p 3000:3000 \
            vyzorix-update-server:latest
          sleep 10
          docker logs vyzorix-test
          docker stop vyzorix-test

      - name: Run container (SSR mode)
        run: |
          # Clean up any existing data directory to ensure fresh migrations
          rm -rf /tmp/vyzorix-data
          mkdir -p /tmp/vyzorix-data
          docker run -d --name vyzorix-ssr-test \
            -e API_KEY_primary=test-secret-minimum-32-chars!! \
            -e SERVER_API_TOKEN=test-secret-minimum-32-chars!! \
            -e JWT_SECRET=test-jwt-secret-minimum-32-chars!! \
            -e SSR_ENABLED=true \
            -v /tmp/vyzorix-data:/data \
            -p 3001:3000 \
            vyzorix-update-server:latest
          sleep 15
          docker logs vyzorix-ssr-test
          docker stop vyzorix-ssr-test

      - name: Health check
        run: |
          # Clean up any existing data directory to ensure fresh migrations
          rm -rf /tmp/vyzorix-data
          mkdir -p /tmp/vyzorix-data
          # Start fresh container for health check with SSR fully disabled
          docker run -d --name vyzorix-health \
            -e API_KEY_primary=test-secret-minimum-32-chars!! \
            -e SERVER_API_TOKEN=test-secret-minimum-32-chars!! \
            -e JWT_SECRET=test-jwt-secret-minimum-32-chars!! \
            -e SSR_ENABLED=false \
            -e SSR_AUTO_BUILD=false \
            -v /tmp/vyzorix-data:/data \
            -p 3002:3000 \
            vyzorix-update-server:latest
          sleep 10

          # Debug: check container logs
          echo "=== Container logs ==="
          docker logs vyzorix-health || true
          echo "=== End logs ==="

          # Test health endpoint
          curl -f http://localhost:3002/health || exit 1

          # Cleanup
          docker stop vyzorix-health

  docker-security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: vyzorix-update-server:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vyzorix-update-server:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Display vulnerabilities
        run: |
          echo "=== Docker Image Vulnerabilities ==="
          trivy image --severity HIGH,CRITICAL vyzorix-update-server:latest || true
          echo ""
          echo "=== Full Report ==="
          trivy image vyzorix-update-server:latest || true

      - name: Fail on critical vulnerabilities
        run: |
          # Count critical issues
          CRITICAL_COUNT=$(trivy image --severity CRITICAL --quiet vyzorix-update-server:latest 2>/dev/null | grep -c "CRITICAL" || echo "0")
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"

          # Note: Using || true to not block PRs, but report in PR
          # For stricter enforcement, change to: if [ "$CRITICAL_COUNT" -gt 0 ]; then exit 1; fi
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "WARNING: Critical vulnerabilities detected. Please review and fix before merging."
          fi
