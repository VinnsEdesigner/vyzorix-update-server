# CI/CD Security Pipeline
# Implements PRD Section 4.15 - CI/CD Security

name: Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security checks weekly
    - cron: '0 0 * * 0'

jobs:
  # ============================================================================
  # 4.15.1 Secret Scanning
  # ============================================================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub Secret Scanning
        run: echo "GitHub Secret Scanning is enabled by default on this repository"

      - name: TruffleHog Secrets Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base_depth: 10
          max_depth: 20
          noverifiy: false
          json: true
          source: true

  # ============================================================================
  # 4.15.2 Static Application Security Testing (SAST)
  # ============================================================================
  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Run GoSec
        run: |
          cd apps/api
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -no-fail -fmt json -out=gosec-results.json ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: 'v2.12.2'
          working-directory: apps/api

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: |
            apps/api/gosec-results.json
            apps/api/golangci-lint-results.json
          retention-days: 30

  # ============================================================================
  # 4.15.3 Dependency Scanning
  # ============================================================================
  dependency-scanning:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Run Go vulnerability scan
        run: |
          cd apps/api
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run go mod verify
        run: |
          cd apps/api
          go mod verify

      - name: Check for go.sum changes
        run: |
          cd apps/api
          cd apps/api && git diff --exit-code go.sum; echo "go.sum check done (may have changes)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  # ============================================================================
  # 4.15.4 Container Security Scanning
  # ============================================================================
  container-scan:
    name: Container Security
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/vinnsedesigner/vyzorix-update-server/vyzorix:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/api/Dockerfile'
          check-template: 'Dockerfile checks'
          format: 'table'

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # 4.15.5 Supply Chain Security
  # ============================================================================
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker baseline
        run: |
          echo "Checking for dangerous base images..."
          if grep -q "FROM alpine:latest" apps/api/Dockerfile; then
            echo "Warning: Using 'latest' tag for base image"
          fi
          if grep -q "RUN.*curl.*|" apps/api/Dockerfile; then
            echo "Warning: Pipe to shell detected in Dockerfile"
          fi

      - name: Check for malicious dependencies
        run: |
          echo "Checking package.json for suspicious scripts..."
          node -e "
            const pkg = require('./package.json');
            const scripts = pkg.scripts || {};
            for (const [name, cmd] of Object.entries(scripts)) {
              if (cmd.includes('curl') && cmd.includes('|')) {
                console.error('Suspicious script found:', name);
                process.exit(1);
              }
            }
          "

  # ============================================================================
  # Build (required for container scanning)
  # ============================================================================
  build:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/vinnsedesigner/vyzorix-update-server/vyzorix:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: false
          tags: ghcr.io/vinnsedesigner/vyzorix-update-server/vyzorix:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
