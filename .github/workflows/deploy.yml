name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_API_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No RENDER_API_TOKEN — skipping deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "Deploy trigger skipped"

      - name: No-op (no secrets)
        if: steps.check.outputs.skip == 'true'
        run: echo "Deploy skipped — no secrets configured"
